# Docker Compose for local development & containerized deployment

services:
  redis:
    image: redis:7-alpine
    container_name: multiagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: nova-gateway
    ports:
      - "8000:8000"
    env_file:
      - gateway/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth-service:8001
      - CHAT_SERVICE=http://chat-service:8002
      - AGENT_SERVICE=http://agent-service:8003
      - BILLING_SERVICE=http://billing-service:8004
    depends_on:
      - redis
      - auth-service
      - chat-service
      - agent-service
      - billing-service
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: nova-auth-service
    ports:
      - "8001:8001"
    env_file:
      - services/auth/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    container_name: nova-chat-service
    ports:
      - "8002:8002"
    env_file:
      - services/chat/.env
    restart: unless-stopped

  agent-service:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: nova-agent-service
    ports:
      - "8003:8003"
    env_file:
      - services/agent/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHAT_SERVICE_URL=http://chat-service:8002
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BILLING_SERVICE_URL=http://billing-service:8004
    depends_on:
      - redis
      - chat-service
    restart: unless-stopped

  billing-service:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: nova-billing-service
    ports:
      - "8004:8004"
    env_file:
      - services/billing/.env
    restart: unless-stopped

volumes:
  redis-data:
